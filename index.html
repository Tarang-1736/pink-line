<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Pink Line | Jaipur's Royal Security</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,900&family=Montserrat:wght@400;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
          crossorigin=""/>

    <style>
      /* Global CSS Overrides for the Heritage Theme */
      :root {
        --heritage-pink: #b05656;
        --palace-cream: #fdfaf5;
      }

      body {
        margin: 0;
        padding: 0;
        overflow: hidden; /* Prevents unwanted scrolling on mobile */
        background-color: var(--palace-cream);
        font-family: 'Montserrat', sans-serif;
      }

      /* Royal Typography */
      .font-serif {
        font-family: 'Playfair Display', serif;
      }

      /* 3. Heritage Map Parchment Effect */
      .heritage-map {
        filter: sepia(0.4) contrast(0.9) brightness(1.1) hue-rotate(-15deg);
      }

      /* Ensure map fills the container correctly */
      .leaflet-container {
        width: 100%;
        height: 100%;
        z-index: 0;
      }

      /* 4. Mandatory Mandala Rotation Animation */
      @keyframes spin-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      .animate-spin-slow {
        animation: spin-slow 25s linear infinite;
      }

      /* Slide-in Animation for the Modern Settings Drawer */
      @keyframes slideIn {
        from { transform: translateX(100%); }
        to { transform: translateX(0); }
      }

      .animate-in {
        animation: slideIn 0.3s ease-out forwards;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
